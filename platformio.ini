[common]
sdkconfig_dir = config

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = espidf
monitor_speed = 115200

[env:station]
build_flags = -DAPP_STATION
board_build.esp-idf.sdkconfig_path = ${common.sdkconfig_dir}/sdkconfig.station

[env:device]
build_flags = -DAPP_DEVICE
board_build.esp-idf.sdkconfig_path = ${common.sdkconfig_dir}/sdkconfig.device

[env:sandbox]
build_flags = -DAPP_SANDBOX
board_build.esp-idf.sdkconfig_path = ${common.sdkconfig_dir}/sdkconfig.sandbox
